buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// react-native-age-signals hardcodes compileSdk 36 and sets no NDK, so it builds
// against a newer libc++ than the app ships and crashes on launch. Match the app.
subprojects { project ->
    if (project.name == "react-native-age-signals") {
        project.plugins.withId("com.android.library") {
            project.androidComponents.finalizeDsl { android ->
                android.compileSdk = rootProject.ext.compileSdkVersion
                android.ndkVersion = rootProject.ext.ndkVersion
            }
        }
    }
}
